[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bookmark-rota"
version = "0.1.0"
description = "Local bookmark catalog, dedupe, rotation, and export pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "rapidfuzz>=3.0,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
health = ["httpx>=0.27", "tenacity>=8"]
llm = ["openai>=1.0"]
schema = ["jsonschema>=4.23"]

[tool.hatch.build.targets.wheel]
packages = ["bookmark_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
